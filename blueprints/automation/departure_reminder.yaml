blueprint:
  name: Swiss Transport – remind me before the next departure
  description: >-
    Sends a notification to your phone a few minutes before the next
    departure of a stop or the next connection of a saved route: line,
    destination, platform and delay. It reminds you of every departure that
    comes into the window, so at a busy stop set the active hours to the time
    you actually leave.


    The text is available in the action field as `{{ message }}`.
  domain: automation
  source_url: https://github.com/prusuino/ha_swiss_transport/blob/main/blueprints/automation/departure_reminder.yaml
  author: prusuino
  homeassistant:
    min_version: 2025.4.0
  input:
    board_sensor:
      name: Stop or route
      description: The departure-board sensor of a stop, or the sensor of a saved connection.
      selector:
        entity:
          filter:
            - integration: swiss_transport
              domain: sensor
              device_class: timestamp
    minutes_before:
      name: Minutes before departure
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider
          unit_of_measurement: min
    active_from:
      name: Active from
      description: No reminders before this time.
      default: "00:00:00"
      selector:
        time:
    active_until:
      name: Active until
      description: No reminders after this time.
      default: "23:59:59"
      selector:
        time:
    notify_device:
      name: Phone
      description: The phone (Home Assistant Companion app) that receives the notification.
      selector:
        device:
          filter:
            - integration: mobile_app
    extra_actions:
      name: Additional actions
      description: Run after the notification. The notification text is available as `{{ message }}`.
      default: []
      selector:
        action:

mode: single
max_exceeded: silent

trigger_variables:
  board_sensor: !input board_sensor
  minutes_before: !input minutes_before

triggers:
  # The next departure changed: at a busy stop the new one can already be
  # inside the window, where the template below stays true and never fires.
  - trigger: state
    entity_id: !input board_sensor
    not_to:
      - unknown
      - unavailable
  # Re-evaluated every minute (now()): the next departure comes into the window.
  - trigger: template
    value_template: >-
      {% set dep = states(board_sensor) | as_datetime %}
      {{ dep is not none and 0 <= ((dep - now()).total_seconds() / 60) <= (minutes_before | int) }}

variables:
  notify_device: !input notify_device
  attrs: "{{ states[board_sensor].attributes if states[board_sensor] is not none else {} }}"
  item: "{{ (attrs.departures or attrs.connections or [none])[0] }}"
  station: "{{ attrs.station_name or (attrs.from_name ~ ' → ' ~ attrs.to_name if attrs.from_name is defined else board_sensor) }}"
  platform: "{{ item.platform if item is mapping and item.platform is defined else (item.dep_platform if item is mapping else none) }}"
  line: "{{ (item.line ~ ' to ' ~ item.to) if item is mapping and item.line is defined else ((item.products or []) | join(', ') if item is mapping else '') }}"
  time: "{{ states(board_sensor) | as_timestamp(0) | timestamp_custom('%H:%M') }}"
  message: >-
    {{ time }} {{ line }}{% if platform %}, platform {{ platform }}{% endif %}{% if item is mapping and item.delay %}, +{{ item.delay }} min{% endif %}

conditions:
  - condition: time
    after: !input active_from
    before: !input active_until
  - condition: template
    value_template: >-
      {% set dep = states(board_sensor) | as_datetime %}
      {{ dep is not none and 0 <= ((dep - now()).total_seconds() / 60) <= (minutes_before | int) }}

actions:
  - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
    data:
      title: "{{ station }}"
      message: "{{ message | trim }}"
  - sequence: !input extra_actions
